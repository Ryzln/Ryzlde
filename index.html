<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Profile</title>
    <link rel="stylesheet" href="charcss.css">
</head>

<body>

<header class="banner">
    <div class="overlay"></div>
    <div class="profile">
        <img src="https://i.pinimg.com/736x/1d/ec/e2/1dece2c8357bdd7cee3b15036344faf5.jpg" class="avatar">
        <div>
            <h1>Enter Name...</h1>
            <p>Character Collector</p>
        </div>
    </div>
    <div class="banner-buttons">
        <a href="ratings.html" class="rate-all-btn">Rate Characters</a>
        <a href="ryzdle.html" class="ryzdle">Ryzdle</a>
        <a href="bracket.html" class="rate-all-btn">Bracket</a>
        <button class="reset-btn" onclick="resetData()">Reset Data</button>
    </div>
</header>

<main class="char-main">

    <!-- Top 5 Characters -->
    <section>
        <h2>Top 5 Characters</h2>
        <div class="grid">
            <div class="card empty" data-slot="top-0"><span class="card-label"></span></div>
            <div class="card empty" data-slot="top-1"><span class="card-label"></span></div>
            <div class="card empty" data-slot="top-2"><span class="card-label"></span></div>
            <div class="card empty" data-slot="top-3"><span class="card-label"></span></div>
            <div class="card empty" data-slot="top-4"><span class="card-label"></span></div>
        </div>
    </section>

    <!-- Favorites -->
    <section>
        <h2>Favorite Heroes</h2>
        <div class="grid">
            <div class="card empty" data-slot="heroes-0"><span class="card-label"></span></div>
            <div class="card empty" data-slot="heroes-1"><span class="card-label"></span></div>
            <div class="card empty" data-slot="heroes-2"><span class="card-label"></span></div>
            <div class="card empty" data-slot="heroes-3"><span class="card-label"></span></div>
            <div class="card empty" data-slot="heroes-4"><span class="card-label"></span></div>
            <div class="card empty" data-slot="heroes-5"><span class="card-label"></span></div>
        </div>
    </section>

    <!-- Recently Added -->
    <section>
        <h2>Favorite Villains</h2>
        <div class="grid">
            <div class="card empty" data-slot="villains-0"><span class="card-label"></span></div>
            <div class="card empty" data-slot="villains-1"><span class="card-label"></span></div>
            <div class="card empty" data-slot="villains-2"><span class="card-label"></span></div>
            <div class="card empty" data-slot="villains-3"><span class="card-label"></span></div>
            <div class="card empty" data-slot="villains-4"><span class="card-label"></span></div>
            <div class="card empty" data-slot="villains-5"><span class="card-label"></span></div>
        </div>
    </section>

</main>

<!-- Edit Modal -->
 <div id="edit-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
    <div class="modal-box">
        <h3>Change Character</h3>
        <input type="text" id="search-input" placeholder="Search by name or show..." />
        <div id="search-results"></div>
    </div>
</div>
<div id="info-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center;">
    <div class="info-box">
        <button class="info-close" onclick="closeInfoPopup()">✕</button>
        <div class="info-image" id="info-image"></div>
        <div class="info-content">
            <h2 id="info-name"></h2>
            <p class="info-show" id="info-show"></p>
            <p class="info-bio" id="info-bio"></p>
            <span class="rating-text">Rating</span>
            <div class="info-rating">
                <div class="star-rating" id="info-stars"></div>
                <strong id="info-rating"></strong>
            </div>
        </div>
    </div>
</div>
<div class="stats-sidebar">
    <h2>Stats</h2>
    <div class="stats-widget">
        <div class="stats-chart">
            <div class="stats-bars" id="stats-bars"></div>
            <div class="stats-axis">
                <span>★ 0</span>
                <span>★ 5</span>
            </div>
        </div>
        <div class="stats-footer">
            <span class="stats-watched-label">Rated</span>
            <span class="stats-watched-count" id="stats-watched">0</span>
        </div>
    </div>
</div>
<div class="wins-sidebar">
    <h2>Bracket Wins</h2>
    <div id="wins-list"></div>
</div>
<script src="characters.js"></script>

</body>
</html>
